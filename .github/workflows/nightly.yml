# The daily test suite: every automated test in the repo, including tests for known bugs
# and the on-emulator device suite on three Android versions, then one readable report.
# What it covers and how it grows: qa/daily/README.md. Claude reads the report each
# morning (a scheduled task) and fixes or reports what failed.
name: Daily tests

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: false

env:
  INCLUDE_KNOWN_BUGS: "1"

jobs:
  core:
    name: Rules core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon --continue -PincludeKnownBugs=true
        working-directory: core
        continue-on-error: true
      - run: mkdir -p qa-results/core && cp core/build/test-results/test/*.xml qa-results/core/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-core, path: qa-results, if-no-files-found: ignore }

  android:
    name: Android unit, screenshots, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest --no-daemon --continue -PincludeKnownBugs=true
        working-directory: android
        continue-on-error: true
      - run: mkdir -p qa-results/android && cp android/app/build/test-results/testDebugUnitTest/*.xml qa-results/android/ || true
      - run: python3 qa/daily/junit_step.py --name gm_base_002_screenshotsMatchBaselines --out qa-results/android --cwd android -- ./gradlew verifyRoborazziDebug --no-daemon
      - run: python3 qa/daily/junit_step.py --name gm_base_003_lintClean --out qa-results/android --cwd android -- ./gradlew lintDebug --no-daemon
      - run: python3 qa/daily/junit_step.py --name gm_base_007_standInAppsBuild --out qa-results/android --cwd qa/antigravity/stub-apps -- ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-android, path: qa-results, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/roborazzi
          if-no-files-found: ignore

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: python3 qa/daily/junit_step.py --name web_typecheck --out qa-results/web --cwd web -- npm run typecheck
      - run: python3 qa/daily/junit_step.py --name web_lint --out qa-results/web --cwd web -- npm run lint
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../qa-results/web/vitest.xml
        working-directory: web
        continue-on-error: true
      - run: python3 qa/daily/junit_step.py --name web_build --out qa-results/web --cwd web -- npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-web, path: qa-results, if-no-files-found: ignore }

  backend:
    name: Firebase rules and functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: firebase/functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci && npm run build
        working-directory: firebase/functions
      - run: python3 qa/daily/junit_step.py --name backend_lint --out qa-results/backend --cwd firebase/functions -- npm run lint
      - run: npx vitest run --config vitest.unit.config.ts --reporter=default --reporter=junit --outputFile.junit=../../qa-results/backend/unit.xml
        working-directory: firebase/functions
        continue-on-error: true
      - name: Rules and functions in the Firebase Emulator Suite
        working-directory: firebase/functions
        continue-on-error: true
        run: >
          npx firebase emulators:exec --config ../firebase.json --only auth,firestore,storage,functions --project demo-guardian
          "npx vitest run --config vitest.emulator.config.ts --reporter=default --reporter=junit --outputFile.junit=../../qa-results/backend/emulator.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-backend, path: qa-results, if-no-files-found: ignore }

  web-e2e:
    name: Dashboard end-to-end (Playwright + Firebase emulators)
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 can't install
    # chromium ("Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci && npm run build
        working-directory: firebase/functions
      - run: npm ci
        working-directory: web
      # Recorded as a step so a browser that can't install shows up in the report by name.
      - run: python3 qa/daily/junit_step.py --name web_e2e_browserInstall --out qa-results/web-e2e --cwd web -- npx playwright install --with-deps chromium
      - name: Playwright against the emulator suite
        working-directory: firebase
        continue-on-error: true
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/qa-results/web-e2e/playwright.xml
        run: npx --prefix functions firebase emulators:exec --project demo-guardian --only auth,firestore,storage,functions "cd ../web && npx playwright test --project=emulator --reporter=line,junit"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-web-e2e, path: qa-results, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 qa/daily/junit_step.py --name dependency_audit_web --out qa-results/audit --cwd web -- npm audit --omit=dev --audit-level=high
      - run: python3 qa/daily/junit_step.py --name dependency_audit_functions --out qa-results/audit --cwd firebase/functions -- npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-audit, path: qa-results, if-no-files-found: ignore }

  # API 29 is the spec's budget phone (Android 10); 33 brings the notification permission;
  # 36 is the target SDK. The host checks (reboots, reinstalls, Doze) run on 29 and 36.
  device:
    strategy:
      fail-fast: false
      matrix:
        api-level: ["29", "33", "36"]
    uses: ./.github/workflows/android-emulator.yml
    with:
      api-level: ${{ matrix.api-level }}
      include-known-bugs: true
      host-checks: ${{ matrix.api-level != '33' }}

  report:
    name: Daily report
    needs: [core, android, web, backend, web-e2e, audit, device]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: qa-results }
      - name: Build the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 qa/daily/report.py --results qa-results --out qa-report
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          --sha "${{ github.sha }}" --repo "${{ github.repository }}"
          ${{ github.ref == 'refs/heads/main' && '--check-release' || '' }}
      - run: cat qa-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: daily-report, path: qa-report }
      # One issue holds the latest report (edited in place, so it doesn't notify), plus a
      # comment only when something newly breaks or newly passes. Scheduled runs on main only.
      - name: Publish to the "Daily test report" issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qa/daily/publish_issue.py --report qa-report --repo "${{ github.repository }}"
