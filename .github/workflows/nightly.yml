name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  emulator-matrix:
    strategy:
      fail-fast: false
      matrix:
        api-level: ["29", "33", "36", "37"]
    uses: ./.github/workflows/android-emulator.yml
    with:
      api-level: ${{ matrix.api-level }}

  web-e2e:
    name: Dashboard end-to-end (Playwright + Firebase emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run build
        working-directory: firebase/functions
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: web
      - name: Playwright against the emulator suite
        working-directory: firebase
        run: npx --prefix functions firebase emulators:exec --project demo-guardian --only auth,firestore,storage,functions "cd ../web && npm run e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: web/playwright-report, if-no-files-found: ignore }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          for dir in web firebase/functions; do
            if [ -f "$dir/package-lock.json" ]; then (cd "$dir" && npm audit --omit=dev --audit-level=high); fi
          done
