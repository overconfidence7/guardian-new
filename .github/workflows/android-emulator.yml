name: Android emulator tests

on:
  push:
    branches: [main]
  pull_request:
    paths: [android/**, core/**, .github/workflows/android-emulator.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      api-level:
        type: string
        default: "36"

concurrency:
  group: emulator-${{ github.ref }}-${{ inputs.api-level || '36' }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (API ${{ inputs.api-level || '36' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
        working-directory: android
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '36' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon || (adb logcat -d -v time > app/build/reports/androidTests/logcat.txt; exit 1)
      - name: Print failing tests
        if: failure()
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{(bad.get('message') or '')[:300]}")
                      print("\n".join((bad.text or "").splitlines()[:40]))
          PY
          if [ -f app/build/reports/androidTests/logcat.txt ]; then
            grep -E "AndroidRuntime|TestRunner|guardianmode|FATAL" app/build/reports/androidTests/logcat.txt | tail -150
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ inputs.api-level || '36' }}
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
