name: Android emulator tests

on:
  push:
    branches: [main]
  pull_request:
    paths: [android/**, core/**, qa/**, .github/workflows/android-emulator.yml]
  workflow_dispatch:
    inputs:
      api-level:
        type: string
        default: "36"
      include-known-bugs:
        type: boolean
        default: false
      host-checks:
        type: boolean
        default: false
  workflow_call:
    inputs:
      api-level:
        type: string
        default: "36"
      include-known-bugs:
        description: Also run tests marked @KnownBug (the daily run does)
        type: boolean
        default: false
      host-checks:
        description: Also run qa/daily/device_checks.py (reboots, reinstalls, process death)
        type: boolean
        default: false

concurrency:
  group: emulator-${{ github.workflow }}-${{ github.ref }}-${{ inputs.api-level || '36' }}
  cancel-in-progress: true

jobs:
  instrumented:
    name: Instrumented tests (API ${{ inputs.api-level || '36' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon
        working-directory: android
      - name: Build the stand-in apps
        run: ./gradlew assembleDebug --no-daemon
        working-directory: qa/antigravity/stub-apps
      # An empty token turns console auth off, so tests inside the emulator can place
      # fake calls through 10.0.2.2:5554 (support/EmulatorConsole.kt).
      - name: Open the emulator console to tests
        run: printf '' > ~/.emulator_console_auth_token
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level || '36' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash qa/daily/run-device-suite.sh qa-results/device-api${{ inputs.api-level || '36' }} ${{ inputs.include-known-bugs || false }} ${{ inputs.host-checks || false }}
      - name: Print failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("qa-results/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{(bad.get('message') or '')[:300]}")
                      print("\n".join((bad.text or "").splitlines()[:40]))
          PY
          for f in qa-results/*/logcat-*.txt; do
            [ -f "$f" ] && grep -E "AndroidRuntime|TestRunner|UiDump|FATAL|GuardianBrain|CardLauncher" "$f" | tail -150
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-device-api${{ inputs.api-level || '36' }}
          path: qa-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-reports-api${{ inputs.api-level || '36' }}
          path: android/app/build/reports/androidTests
          if-no-files-found: ignore
