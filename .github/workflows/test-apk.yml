name: Publish test APK

# Builds an APK for sideloading onto a real test phone and publishes it as the
# rolling "testing" pre-release. It runs without the Firebase emulators, so the
# app works offline ("Set up on my own for now"); family pairing needs the real
# Firebase project. The fixed test key (android/testing) means each new build
# installs over the last one. It is not the Play upload key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the fixed test signing key
        run: mkdir -p ~/.android && cp android/testing/test-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        env:
          GUARDIAN_USE_EMULATORS: "false"
          GUARDIAN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish to the testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=guardian-mode-test.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha=$(git rev-parse --short HEAD)
          notes="Test build from $sha (build ${{ github.run_number }}). Install steps: docs/TESTING.md, \"Install on a real phone\"."
          # Remove the old release (and any draft left by a failed run), then move the
          # tag ourselves before creating the new one. Deleting the tag through
          # "gh release delete --cleanup-tag" can finish after the new release exists,
          # which leaves it as an untagged draft nobody can see.
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "testing" or (.draft and (.name | startswith("Test build")))) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          git tag -f testing "$GITHUB_SHA"
          git push -f origin refs/tags/testing
          gh release create testing "$apk" --verify-tag --prerelease --title "Test build $sha" --notes "$notes"
          test "$(gh release view testing --json isDraft --jq .isDraft)" = "false"
