name: Publish test APK

# Builds an APK for sideloading onto a real test phone and publishes it as the
# rolling "testing" pre-release. It runs without the Firebase emulators, so the
# app works offline ("Set up on my own for now"); family pairing needs the real
# Firebase project. The fixed test key (android/testing) means each new build
# installs over the last one. It is not the Play upload key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the fixed test signing key
        run: mkdir -p ~/.android && cp android/testing/test-debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        env:
          GUARDIAN_USE_EMULATORS: "false"
          GUARDIAN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish to the testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=guardian-mode-test.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha=$(git rev-parse --short HEAD)
          notes="Test build from $sha (build ${{ github.run_number }}). Install steps: docs/TESTING.md, \"Install on a real phone\"."
          # Recreate the release so the tag always points at this commit.
          gh release delete testing --cleanup-tag --yes 2>/dev/null || true
          gh release create testing --prerelease --title "Test build $sha" --notes "$notes" --target "$GITHUB_SHA"
          gh release upload testing "$apk" --clobber
