name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rules core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
        working-directory: core
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: core-test-report, path: core/build/reports/tests }

  android:
    name: Android build, lint, unit and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
        working-directory: android
      - name: Unit and Robolectric tests
        run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: android
      - name: Screenshot check
        working-directory: android
        run: |
          if ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            ./gradlew verifyRoborazziDebug --no-daemon
          else
            echo "No screenshot baselines yet; recording them as an artifact."
            ./gradlew recordRoborazziDebug --no-daemon
          fi
      - name: Lint
        run: ./gradlew lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/roborazzi
            android/app/src/test/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Firebase rules and functions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run: { working-directory: firebase/functions }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: firebase/functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Rules and integration tests in the Firebase Emulator Suite
        run: npm run test:emulator
